name: Run crank

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-crank:
    name: Fetch data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install Dependencies
        id: yarn-ci
        run: yarn install

      - name: Validate generator
        run: yarn test

      - name: Run bot
        id: run-bot
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: yarn start
